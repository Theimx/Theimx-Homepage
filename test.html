<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barre Latérale Rétractable</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* Barre latérale */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #333;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            transition: width 0.3s;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar h2 {
            text-align: center;
            margin: 20px 0;
            font-size: 1.5em;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }

        .sidebar ul li:hover {
            background-color: #555;
        }

        /* Contenu principal */
        .content {
            margin-left: 250px;
            padding: 20px;
            transition: margin-left 0.3s;
            width: 100%;
        }

        .content.collapsed {
            margin-left: 60px;
        }

        /* Bouton pour rétracter */
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -15px;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }

        .toggle-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <!-- Barre latérale -->
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" id="toggle-btn">☰</button>
        <h2>Menu</h2>
        <ul>
            <li>Accueil</li>
            <li>À propos</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </div>

    <!-- Contenu principal -->
    <div class="content" id="content">
        <h1>Bienvenue sur la page !</h1>
        <p>Ceci est un exemple de page avec une barre latérale rétractable.</p>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const toggleBtn = document.getElementById('toggle-btn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
